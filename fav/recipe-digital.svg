<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Digitalisiertes Rezept</title>
  <desc id="desc">Das Apfelkuchenrezept in einer klaren digitalen Kochansicht.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fbf7"/>
      <stop offset="1" stop-color="#e9f3e9"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dba65f"/>
      <stop offset="1" stop-color="#8f522e"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="22" flood-color="#17341f" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#page)"/>
  <rect x="76" y="58" width="1048" height="684" rx="26" fill="#fff" stroke="#d5e0d6" stroke-width="3" filter="url(#card-shadow)"/>
  <rect x="76" y="58" width="1048" height="74" rx="26" fill="#f7f9f5"/>
  <path d="M76 108h1048M125 95h95" stroke="#d9e2da" stroke-width="3"/>
  <circle cx="1028" cy="95" r="19" fill="#e8f5eb"/>
  <path d="m1020 95 6 6 11-13" fill="none" stroke="#187a3b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(116 168)">
    <rect width="310" height="256" rx="18" fill="url(#photo)"/>
    <ellipse cx="155" cy="142" rx="110" ry="76" fill="#f5d99a"/>
    <path d="M75 145c30-52 52-45 76-18 24-49 62-46 91 8 18 35-23 65-88 73-61-8-99-31-79-63z" fill="#d5944f"/>
    <path d="M93 112c34 15 83 14 126-2M109 165c31 12 65 13 102 0" fill="none" stroke="#f8e9bd" stroke-width="10" stroke-linecap="round" opacity=".75"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="472" y="198" fill="#187a3b" font-size="18" font-weight="700" letter-spacing="2">KUCHEN</text>
    <text x="472" y="252" fill="#17221a" font-size="48" font-weight="800">Omas Apfelkuchen</text>
    <text x="472" y="297" fill="#667168" font-size="22">45 Minuten  &#183;  8 Zutaten</text>
    <rect x="472" y="334" width="142" height="42" rx="21" fill="#e8f5eb"/>
    <text x="498" y="362" fill="#187a3b" font-size="18" font-weight="700">Familienrezept</text>
    <text x="116" y="486" fill="#17221a" font-size="26" font-weight="800">Zutaten</text>
    <text x="116" y="532" fill="#4e5b51" font-size="21">3 &#196;pfel</text>
    <text x="116" y="570" fill="#4e5b51" font-size="21">250 g Mehl</text>
    <text x="116" y="608" fill="#4e5b51" font-size="21">150 g Butter</text>
    <text x="306" y="532" fill="#4e5b51" font-size="21">120 g Zucker</text>
    <text x="306" y="570" fill="#4e5b51" font-size="21">2 Eier</text>
    <text x="306" y="608" fill="#4e5b51" font-size="21">Zimt &amp; Backpulver</text>
    <text x="558" y="486" fill="#17221a" font-size="26" font-weight="800">Zubereitung</text>
    <circle cx="578" cy="535" r="20" fill="#e8f5eb"/>
    <text x="572" y="542" fill="#187a3b" font-size="18" font-weight="800">1</text>
    <text x="614" y="530" fill="#4e5b51" font-size="20">Butter und Zucker verr&#252;hren,</text>
    <text x="614" y="558" fill="#4e5b51" font-size="20">anschlie&#223;end die Eier dazugeben.</text>
    <circle cx="578" cy="614" r="20" fill="#e8f5eb"/>
    <text x="572" y="621" fill="#187a3b" font-size="18" font-weight="800">2</text>
    <text x="614" y="609" fill="#4e5b51" font-size="20">Mehl unterheben, &#196;pfel schneiden</text>
    <text x="614" y="637" fill="#4e5b51" font-size="20">und bei 180 Grad 45 Min. backen.</text>
  </g>
</svg>
