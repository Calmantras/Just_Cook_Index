<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f4" />
    <title>Page not found | Just Cook!</title>
    <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
    <style>
      :root {
        color-scheme: light;
        --color-primary: #187a3b;
        --color-primary-hover: #12632f;
        --color-primary-soft: #e8f5eb;
        --color-white: #ffffff;
        --color-text: #17221a;
        --color-text-muted: #5f6b62;
        --color-border: #d9e1da;
        --color-surface: #ffffff;
        --color-bg-page: #f7f8f4;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-10: 40px;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-xl: 24px;
        --radius-circle: 999px;
        --shadow-md: 0 12px 28px rgba(23, 34, 26, 0.1), 0 2px 8px rgba(23, 34, 26, 0.06);
        --font-primary: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        background: var(--color-bg-page);
        color: var(--color-text);
        font-family: var(--font-primary);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .not-found-page { width: 100%; padding: var(--space-6) var(--space-4); }

      .not-found-card {
        width: min(100%, 480px);
        margin: 0 auto;
        padding: var(--space-8) var(--space-6);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-xl);
        background: var(--color-surface);
        box-shadow: var(--shadow-md);
        text-align: center;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        margin-bottom: var(--space-8);
        font-size: 15px;
      }

      .brand-logo { width: 34px; height: 34px; object-fit: contain; }

      .not-found-illustration {
        position: relative;
        display: grid;
        width: 132px;
        height: 132px;
        margin: 0 auto var(--space-8);
        place-items: center;
        border-radius: var(--radius-circle);
        background: var(--color-primary-soft);
        color: var(--color-primary);
      }

      .not-found-illustration::before, .not-found-illustration::after {
        position: absolute;
        border: 1px solid rgba(24, 122, 59, 0.18);
        border-radius: var(--radius-circle);
        content: "";
      }

      .not-found-illustration::before { width: 104px; height: 104px; }
      .not-found-illustration::after { width: 156px; height: 156px; }
      .not-found-illustration ion-icon { font-size: 42px; }

      .not-found-illustration span {
        position: absolute;
        right: -14px;
        bottom: -8px;
        padding: var(--space-1) var(--space-2);
        border-radius: var(--radius-sm);
        background: var(--color-primary);
        color: var(--color-white);
        font-size: 14px;
        font-weight: 700;
      }

      .eyebrow {
        margin: 0 0 var(--space-2);
        color: var(--color-primary);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 var(--space-3);
        font-size: clamp(30px, 8vw, 40px);
        letter-spacing: -0.045em;
        line-height: 1.08;
      }

      .description {
        max-width: 330px;
        margin: 0 auto var(--space-6);
        color: var(--color-text-muted);
        line-height: 1.5;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        gap: var(--space-2);
        padding: 0 var(--space-5);
        border-radius: var(--radius-md);
        background: var(--color-primary);
        color: var(--color-white);
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: background 150ms ease, transform 150ms ease;
      }

      .back-link:hover { background: var(--color-primary-hover); transform: translateY(-1px); }
      .back-link ion-icon { font-size: 19px; }
      .back-link:focus-visible { outline: 3px solid rgba(45, 143, 82, 0.45); outline-offset: 3px; }

      .legal-links {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
        margin-top: var(--space-6);
        color: var(--color-text-muted);
        font-size: 13px;
      }

      .legal-links span { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .legal-links a { color: inherit; text-underline-offset: 3px; }
      .legal-links a:hover { color: var(--color-primary); }

      @media (min-width: 768px) {
        .not-found-card { padding: var(--space-10) var(--space-8); }
      }
    </style>
  </head>
  <body>
    <main class="not-found-page" aria-labelledby="not-found-title">
      <section class="not-found-card">
        <div class="brand-lockup">
          <img class="brand-logo" src="/fav/favicon.svg" alt="" />
          <strong>Just Cook!</strong>
        </div>
        <div class="not-found-illustration" aria-hidden="true">
          <ion-icon name="restaurant-outline"></ion-icon>
          <span>404</span>
        </div>
        <p class="eyebrow">Page not found</p>
        <h1 id="not-found-title">This ingredient is missing.</h1>
        <p class="description">The page you requested does not exist or has been moved.</p>
        <a class="back-link" href="https://app.just-cook.net/login">
          <ion-icon name="arrow-back-outline" aria-hidden="true"></ion-icon>
          Back to the app
        </a>
        <nav class="legal-links" aria-label="Legal information">
          <a href="/legal#impressum">Impressum</a>
          <a href="/legal#datenschutz">Datenschutz</a>
          <a href="/legal#agb">AGB</a>
          <a href="/legal#widerruf">Widerruf</a>
        </nav>
      </section>
    </main>
  </body>
</html>
