server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico|css|js|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /impressum {
        return 302 "/legal#impressum";
    }

    location = /datenschutz {
        return 302 "/legal#datenschutz";
    }

    location = /404.html {
        internal;
    }
}
